[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ao3-reader"
version = "0.1.0"
description = "Turn Archive of Our Own works into audiobooks, read by a natural-sounding voice that runs on your own computer."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.5",
    "kokoro-onnx>=0.4.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ao3-reader = "ao3reader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ao3reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
